# Project name -> prefixes every compose-created resource (default network,
# volumes) with "relqs_backend" instead of the directory-derived "backend".
# e.g. the default network becomes relqs_backend_default.
name: relqs_backend

services:
  relqs-web-service:
    build: .
    container_name: relqs-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://postiz-redis:6379/1
    volumes:
      - ./:/app
    networks:
      - default
      - postiz

networks:
  postiz:
    external: true
    name: soljet-postiz_postiz-network
