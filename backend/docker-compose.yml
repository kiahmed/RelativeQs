services:
  web:
    build: .
    container_name: relativeqs-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://postiz-redis:6379/1
    volumes:
      - ./:/app
    networks:
      - default
      - postiz

networks:
  postiz:
    external: true
    name: soljet-postiz_postiz-network
