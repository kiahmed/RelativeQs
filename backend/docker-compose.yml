# Project name -> prefixes every compose-created resource (default network,
# volumes) with "rq_backend" instead of the directory-derived "backend".
# e.g. the default network becomes rq_backend_default.
name: rq_backend

services:
  rq-web-service:
    build: .
    container_name: rq-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://postiz-redis:6379/1
    volumes:
      - ./:/app
    networks:
      - default
      - postiz

networks:
  postiz:
    external: true
    name: soljet-postiz_postiz-network
