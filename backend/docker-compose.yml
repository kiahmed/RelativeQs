# Local backend stack:
#
#   relativeq-backend      FastAPI poller + API (uvicorn on :8000 inside the net)
#   relqs-cloudflared  Cloudflare named tunnel -> https://edge-relativeq.facades.trade
#
# Project name -> prefixes every compose-created resource (default network,
# volumes) with "relqs_backend" instead of the directory-derived "backend".
name: relqs_backend

services:
  relqs-web-service:
    build: .
    container_name: relativeq-backend
    restart: unless-stopped
    # Host loopback only, for local curl/debugging. The tunnel does NOT use
    # this — it reaches the app over the compose network.
    ports:
      - "127.0.0.1:8001:8000"
    # Runtime config, including REDIS_URL -> the managed Upstash instance, so a
    # local run picks up the snapshot/bars keys. This backend is a SINGLETON
    # poller: run ONE at a time, or two writers will clobber `bars:<date>`.
    env_file:
      - .env
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      relqs-network:
        # cf-tunnel.sh points the tunnel ingress at http://relativeq-backend:8000,
        # so pin that name rather than relying on the service name.
        aliases:
          - relativeq-backend

  # Cloudflare *named* tunnel — a permanent hostname routed to the backend.
  # The hostname, ingress and DNS record live in Cloudflare and belong to the
  # tunnel, not to this container, so a restart/rebuild/host-move keeps the
  # same URL. That permanence is what lets the Vercel frontend bake the URL in
  # at build time instead of discovering it at runtime.
  #
  # Create it (once) with:  make tunnel-create
  # which writes CF_TUNNEL_TOKEN into deploy/.env — interpolated here because
  # the Makefile passes `--env-file deploy/.env` to every compose command.
  relqs-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: relqs-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Deliberately `:-` and not `:?`. A required-variable guard here would
      # fail EVERY compose command — `down`, `logs`, `ps` included — so a
      # missing token would lock you out of tearing the stack down. An empty
      # token just makes cloudflared exit; `make tunnel-status` says why.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
      # Force HTTP/2 (TCP 443) instead of QUIC (UDP 7844). The QUIC datagram
      # path to Cloudflare's edge degrades intermittently under WSL2 NAT and
      # cloudflared can get stuck retrying it instead of falling back.
      TUNNEL_TRANSPORT_PROTOCOL: http2
    depends_on:
      relqs-web-service:
        condition: service_started
    networks:
      - relqs-network

networks:
  relqs-network:
    external: false
