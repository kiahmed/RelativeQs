# Project name -> prefixes every compose-created resource (default network,
# volumes) with "relqs_backend" instead of the directory-derived "backend".
# e.g. the default network becomes relqs_backend_default.
name: relqs_backend

services:
  relqs-web-service:
    build: .
    container_name: relqs-backend
    ports:
      - "8001:8000"
    # Same env the Fly machine gets: REDIS_URL points at the managed Upstash
    # instance, so a local run picks up the snapshot/bars keys the cloud
    # deploy has been accumulating. Run ONE poller at a time — Fly and a local
    # container both writing `bars:<date>` will clobber each other.
    env_file:
      - .env
    volumes:
      - ./:/app
